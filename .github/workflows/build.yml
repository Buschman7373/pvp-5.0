name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: |
          echo "Dateien im Repository:"
          ls -R . | head -n 60
          BG=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$BG" ]; then
            echo "FEHLER: build.gradle nicht im Repository gefunden"
            exit 1
          fi
          cd "$(dirname "$BG")"
          gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: duel-analyzer
          path: "**/build/libs/*.jar"
