name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        working-directory: duel-analyzer-1.21.11
        run: gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: duel-analyzer
          path: duel-analyzer-1.21.11/build/libs/*.jar
